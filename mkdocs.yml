site_name: Sonarr and Radarr for Mere Mortals
site_description: A plain-language guide to Sonarr and Radarr, the library managers that catalogue television and film, track what a collection is missing, and rename and organise what it has. Installing both on one machine, root folders and quality profiles, indexers and download clients, importing files you already have, and calendars and monitoring, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/arr-stack-for-mere-mortals/
